<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Ruleta de Dayana <3</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background: #fffafa;
            color: #555;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app {
            width: 100%;
            max-width: 1100px;
            min-height: 100vh;
            padding: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .screen {
            width: 100%;
        }

        .hidden {
            display: none !important;
        }

        /* ==================================================
           LOGIN / CONFIGURACIÓN
        ================================================== */

        .login-card,
        .setup-card {
            width: 100%;
            max-width: 500px;
            margin: auto;
            background: #fff;
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .login-card h1,
        .setup-card h1 {
            margin: 0 0 10px;
            color: #ed858b;
            font-size: 28px;
        }

        .login-card p,
        .setup-card p {
            color: #999;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #f3d2d5;
            border-radius: 12px;
            outline: none;
            font-size: 16px;
            margin-bottom: 15px;
        }

        input:focus {
            border-color: #ef8b91;
            box-shadow: 0 0 0 4px rgba(239, 139, 145, 0.1);
        }

        button {
            border: none;
            cursor: pointer;
            border-radius: 12px;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            transition: 0.2s;
        }

        button:disabled {
            cursor: not-allowed;
        }

        .primary-btn {
            background: #ef8b91;
            color: white;
        }

        .primary-btn:hover:not(:disabled) {
            background: #e97980;
            transform: translateY(-2px);
        }

        .error {
            color: #e74c3c;
            margin-top: 10px;
            font-size: 14px;
            min-height: 20px;
        }

        /* ==================================================
           INPUTS DE TEMAS
        ================================================== */

        #topicsContainer {
            margin-top: 20px;
            text-align: left;
        }

        .topic-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .topic-number {
            flex: 0 0 30px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #f7b5b9;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

        .topic-row input {
            margin: 0;
        }

        #prepareButton {
            margin-top: 15px;
        }

        /* ==================================================
           JUEGO
        ================================================== */

        .game-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .top-bar {
            width: 100%;
            max-width: 850px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .title {
            color: #ed858b;
            font-size: 28px;
            font-weight: bold;
        }

        /* ==================================================
           CRONÓMETRO
        ================================================== */

        .timer-box {
            background: #ef6e78;
            color: white;
            padding: 10px 20px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(239, 110, 120, 0.25);
            text-align: center;
        }

        .timer-label {
            font-size: 10px;
            opacity: 0.8;
            margin-bottom: 2px;
        }

        #timer {
            font-family: "Courier New", monospace;
            font-size: 29px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        /* ==================================================
           RUEDA
        ================================================== */

        .wheel-area {
            /*
             * Se adapta automáticamente al teléfono.
             */
            width: min(520px, 90vw);
            aspect-ratio: 1 / 1;
            position: relative;
        }

        .pointer {
            position: absolute;
            top: -2px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;

            width: 0;
            height: 0;

            border-left: clamp(12px, 3vw, 18px) solid transparent;
            border-right: clamp(12px, 3vw, 18px) solid transparent;
            border-top: clamp(35px, 8vw, 55px) solid #ef858b;
        }

        .pointer::before {
            content: "";
            position: absolute;

            width: clamp(20px, 5vw, 28px);
            height: clamp(9px, 2vw, 13px);

            background: #ef858b;

            top: clamp(-55px, -8vw, -35px);
            left: 50%;
            transform: translateX(-50%);
        }

        .wheel {
            position: absolute;

            inset: 4%;

            border-radius: 50%;

            border: clamp(7px, 2vw, 10px) solid #ef858b;

            overflow: hidden;

            background: #f9cccc;

            box-shadow:
                0 10px 20px rgba(0, 0, 0, 0.08),
                inset 0 0 0 2px rgba(255,255,255,0.5);

            /*
             * La animación se controla desde JavaScript.
             */
            transition: transform 5s cubic-bezier(0.12, 0.75, 0.12, 1);
        }

        /* ==================================================
           SEGMENTOS
        ================================================== */

        .wheel-segments {
            position: absolute;
            inset: 0;
            border-radius: 50%;
        }

        /* ==================================================
           NOMBRES DE TEMAS
        ================================================== */

        .topic-label {
            position: absolute;

            /*
             * El tamaño se adapta al dispositivo.
             */
            width: clamp(65px, 18vw, 120px);

            text-align: center;

            color: #e98288;

            font-weight: bold;

            font-size: clamp(9px, 2.6vw, 15px);

            line-height: 1.15;

            z-index: 4;

            /*
             * Evita que un texto demasiado largo
             * rompa el diseño.
             */
            overflow-wrap: anywhere;

            pointer-events: none;

            /*
             * Hace que el texto sea más visible.
             */
            text-shadow:
                0 1px 0 rgba(255,255,255,0.6);
        }

        /* ==================================================
           CENTRO DE LA RULETA
        ================================================== */

        .center {
            position: absolute;

            width: clamp(42px, 10vw, 58px);
            height: clamp(42px, 10vw, 58px);

            background: #ef858b;

            border-radius: 50%;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            z-index: 10;

            box-shadow:
                0 0 0 4px rgba(255,255,255,0.45);
        }

        /* ==================================================
           TEMA SELECCIONADO
        ================================================== */

        .selected-topic {
            /*
             * Está fuera de la rueda.
             * Así no rota y no interfiere con ella.
             */
            width: min(90vw, 600px);

            min-height: 70px;

            margin-top: 15px;

            padding: 15px 25px;

            border-radius: 18px;

            background: white;

            border: 2px solid #f3c6c9;

            box-shadow:
                0 8px 25px rgba(0,0,0,0.07);

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;
        }

        .selected-topic-label {
            color: #aaa;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        #selectedTopic {
            color: #e97980;
            font-size: clamp(20px, 5vw, 30px);
            font-weight: bold;
            line-height: 1.2;
            overflow-wrap: anywhere;
        }

        /* ==================================================
           CONTROLES
        ================================================== */

        .controls {
            margin-top: 18px;

            display: flex;

            justify-content: center;

            align-items: center;
        }

        #startButton {
            min-width: 180px;
            font-size: 18px;
            padding: 14px 35px;
        }

        .status {
            margin-top: 12px;
            color: #999;
            font-size: 14px;
            text-align: center;
        }

        .phase {
            font-weight: bold;
            color: #ed858b;
        }

        /* ==================================================
           CELULARES
        ================================================== */

        @media (max-width: 600px) {

            body {
                align-items: flex-start;
            }

            .app {
                padding: 18px 12px 30px;
            }

            .top-bar {
                flex-direction: column;
                gap: 12px;
                margin-bottom: 15px;
            }

            .title {
                font-size: 23px;
            }

            .timer-box {
                padding: 8px 18px;
            }

            #timer {
                font-size: 24px;
            }

            .wheel-area {
                width: min(92vw, 430px);
            }

            .selected-topic {
                margin-top: 12px;
                padding: 13px 18px;
                min-height: 65px;
            }

            #selectedTopic {
                font-size: 21px;
            }

            #startButton {
                width: 220px;
            }
        }

        /* ==================================================
           CELULARES MUY PEQUEÑOS
        ================================================== */

        @media (max-width: 380px) {

            .app {
                padding: 12px 8px 25px;
            }

            .title {
                font-size: 20px;
            }

            .wheel-area {
                width: 94vw;
            }

            .topic-label {
                width: 58px;
                font-size: 8px;
            }

            .selected-topic {
                width: 94vw;
            }

            #selectedTopic {
                font-size: 19px;
            }

            #startButton {
                width: 200px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- ==================================================
         LOGIN
    ================================================== -->

    <section id="loginScreen" class="screen">

        <div class="login-card">

            <h1>🎡 Ruleta de Temas</h1>

            <p>
                Ingresa la contraseña para comenzar.
            </p>

            <input
                type="password"
                id="passwordInput"
                placeholder="Contraseña"
                autocomplete="off"
            >

            <button
                class="primary-btn"
                id="loginButton"
            >
                Ingresar
            </button>

            <div id="loginError" class="error"></div>

        </div>

    </section>


    <!-- ==================================================
         CONFIGURACIÓN
    ================================================== -->

    <section id="setupScreen" class="screen hidden">

        <div class="setup-card">

            <h1>🎯 Configurar temas</h1>

            <p>
                ¿Cuántos temas quieres agregar?
            </p>

            <input
                type="number"
                id="topicCount"
                min="1"
                max="20"
                placeholder="Ejemplo: 8"
            >

            <button
                class="primary-btn"
                id="createTopicsButton"
            >
                Continuar
            </button>

            <div id="topicsContainer"></div>

            <button
                id="prepareButton"
                class="primary-btn hidden"
            >
                Preparar ruleta
            </button>

            <div id="setupError" class="error"></div>

        </div>

    </section>


    <!-- ==================================================
         JUEGO
    ================================================== -->

    <section id="gameScreen" class="screen hidden">

        <div class="game-container">

            <div class="top-bar">

                <div class="title">
                    🎡 Ruleta de Temas
                </div>

                <div class="timer-box">

                    <div class="timer-label">
                        TIEMPO
                    </div>

                    <div id="timer">
                        10:00
                    </div>

                </div>

            </div>


            <!-- RULETA -->

            <div class="wheel-area">

                <div class="pointer"></div>

                <div id="wheel" class="wheel">

                    <div
                        id="wheelSegments"
                        class="wheel-segments">
                    </div>

                    <div id="topicLabels"></div>

                    <div class="center"></div>

                </div>

            </div>


            <!-- TEMA SELECCIONADO -->

            <div
                id="selectedTopicBox"
                class="selected-topic hidden">

                <div class="selected-topic-label">
                    Tema seleccionado
                </div>

                <div id="selectedTopic">
                </div>

            </div>


            <!-- BOTÓN -->

            <div class="controls">

                <button
                    id="startButton"
                    class="primary-btn">
                    Iniciar
                </button>

            </div>


            <div class="status">

                Estado:
                <span
                    id="statusText"
                    class="phase">
                    Preparado
                </span>

            </div>

        </div>

    </section>

</div>


<script>

    /* ==================================================
       CONFIGURACIÓN
    ================================================== */

    const PASSWORD = "<3";

    const STUDY_TIME = 10 * 60;

    const BREAK_TIME = 2 * 60;


    let topics = [];

    let currentTime = STUDY_TIME;

    let timerInterval = null;

    let currentPhase = "study";

    let running = false;

    let selectedTopicIndex = -1;

    let currentRotation = 0;


    /* ==================================================
       ELEMENTOS
    ================================================== */

    const loginScreen =
        document.getElementById("loginScreen");

    const setupScreen =
        document.getElementById("setupScreen");

    const gameScreen =
        document.getElementById("gameScreen");

    const timerElement =
        document.getElementById("timer");

    const statusText =
        document.getElementById("statusText");

    const startButton =
        document.getElementById("startButton");

    const wheel =
        document.getElementById("wheel");

    const wheelSegments =
        document.getElementById("wheelSegments");

    const topicLabels =
        document.getElementById("topicLabels");

    const selectedTopicBox =
        document.getElementById("selectedTopicBox");

    const selectedTopicElement =
        document.getElementById("selectedTopic");


    /* ==================================================
       LOGIN
    ================================================== */

    function verifyPassword() {

        const password =
            document.getElementById("passwordInput").value;

        const error =
            document.getElementById("loginError");


        if (password === PASSWORD) {

            error.textContent = "";

            loginScreen.classList.add("hidden");

            setupScreen.classList.remove("hidden");

        } else {

            error.textContent =
                "Contraseña incorrecta.";

        }

    }


    document
        .getElementById("loginButton")
        .addEventListener("click", verifyPassword);


    document
        .getElementById("passwordInput")
        .addEventListener("keydown", function(event) {

            if (event.key === "Enter") {
                verifyPassword();
            }

        });


    /* ==================================================
       CREAR INPUTS
    ================================================== */

    function createTopicInputs() {

        const count =
            parseInt(
                document.getElementById("topicCount").value
            );

        const container =
            document.getElementById("topicsContainer");

        const prepareButton =
            document.getElementById("prepareButton");

        const error =
            document.getElementById("setupError");


        container.innerHTML = "";

        error.textContent = "";

        prepareButton.classList.add("hidden");


        if (
            isNaN(count) ||
            count < 1 ||
            count > 20
        ) {

            error.textContent =
                "Ingresa una cantidad entre 1 y 20.";

            return;

        }


        for (let i = 0; i < count; i++) {

            const row =
                document.createElement("div");

            row.className =
                "topic-row";


            const number =
                document.createElement("div");

            number.className =
                "topic-number";

            number.textContent =
                i + 1;


            const input =
                document.createElement("input");

            input.type = "text";

            input.className =
                "topic-input";

            input.placeholder =
                `Tema ${i + 1}`;

            input.autocomplete =
                "off";


            row.appendChild(number);

            row.appendChild(input);

            container.appendChild(row);

        }


        prepareButton.classList.remove("hidden");

    }


    document
        .getElementById("createTopicsButton")
        .addEventListener(
            "click",
            createTopicInputs
        );


    /* ==================================================
       PREPARAR JUEGO
    ================================================== */

    function prepareGame() {

        const inputs =
            document.querySelectorAll(".topic-input");

        const error =
            document.getElementById("setupError");


        topics = [];


        inputs.forEach(input => {

            const value =
                input.value.trim();

            topics.push(value);

        });


        if (
            topics.some(topic => topic === "")
        ) {

            error.textContent =
                "Debes ingresar todos los temas.";

            return;

        }


        error.textContent = "";


        createWheel();


        setupScreen.classList.add("hidden");

        gameScreen.classList.remove("hidden");


        resetGame();

    }


    document
        .getElementById("prepareButton")
        .addEventListener(
            "click",
            prepareGame
        );


    /* ==================================================
       CREAR RULETA
    ================================================== */

    function createWheel() {

        wheelSegments.innerHTML = "";

        topicLabels.innerHTML = "";


        const count =
            topics.length;

        const segmentSize =
            360 / count;


        const colors = [
            "#f7c8ca",
            "#fce3df"
        ];


        let gradient = "";


        for (let i = 0; i < count; i++) {

            const start =
                i * segmentSize;

            const end =
                (i + 1) * segmentSize;


            gradient +=
                `${colors[i % 2]} ${start}deg ${end}deg`;

            if (i < count - 1) {
                gradient += ", ";
            }

        }


        /*
         * La rueda empieza con el primer
         * segmento arriba.
         */

        wheel.style.background =
            `conic-gradient(from -90deg, ${gradient})`;


        /*
         * Creamos los textos.
         */

        topics.forEach((topic, index) => {

            const label =
                document.createElement("div");

            label.className =
                "topic-label";

            label.textContent =
                topic;


            const angle =
                index * segmentSize +
                segmentSize / 2 -
                90;


            /*
             * IMPORTANTE:
             *
             * Usamos porcentaje en lugar
             * de píxeles fijos.
             *
             * Esto hace que funcione
             * correctamente en celulares.
             */

            const radiusPercent =
                count <= 8
                    ? 34
                    : count <= 12
                        ? 35
                        : 36;


            const radians =
                angle * Math.PI / 180;


            const x =
                50 +
                Math.cos(radians) * radiusPercent;


            const y =
                50 +
                Math.sin(radians) * radiusPercent;


            label.style.left =
                `${x}%`;

            label.style.top =
                `${y}%`;


            /*
             * El texto NO se rota.
             *
             * Así siempre es legible.
             */

            label.style.transform =
                "translate(-50%, -50%)";


            topicLabels.appendChild(label);

        });

    }


    /* ==================================================
       FORMATO DEL TIEMPO
    ================================================== */

    function formatTime(seconds) {

        const minutes =
            Math.floor(seconds / 60);

        const secs =
            seconds % 60;


        return (
            String(minutes).padStart(2, "0")
            +
            ":"
            +
            String(secs).padStart(2, "0")
        );

    }


    function updateTimer() {

        timerElement.textContent =
            formatTime(currentTime);

    }


    /* ==================================================
       SELECCIONAR TEMA Y GIRAR RULETA
    ================================================== */

    function startCycle() {

        if (running) {
            return;
        }


        /*
         * Ocultamos el tema anterior
         * mientras gira nuevamente.
         */

        selectedTopicBox.classList.add("hidden");


        /*
         * Elegimos aleatoriamente el tema.
         */

        selectedTopicIndex =
            Math.floor(
                Math.random() * topics.length
            );


        const segmentSize =
            360 / topics.length;


        /*
         * Calculamos el centro del segmento.
         */

        const segmentCenter =
            selectedTopicIndex * segmentSize +
            segmentSize / 2;


        /*
         * Queremos que el centro del segmento
         * quede debajo de la flecha superior.
         */

        const targetRotation =
            360 -
            segmentCenter;


        /*
         * Damos varias vueltas antes
         * de llegar al tema seleccionado.
         */

        const extraTurns =
            360 * 5;


        currentRotation +=
            extraTurns +
            targetRotation;


        running = true;


        startButton.disabled = true;

        startButton.style.opacity = "0.5";


        statusText.textContent =
            "Girando...";


        /*
         * Reiniciamos la transición.
         */

        wheel.style.transition =
            "none";

        wheel.style.transform =
            `rotate(${currentRotation - extraTurns - targetRotation}deg)`;


        /*
         * Forzamos al navegador a
         * reconocer el estado inicial.
         */

        wheel.offsetHeight;


        wheel.style.transition =
            "transform 5s cubic-bezier(0.12, 0.75, 0.12, 1)";


        wheel.style.transform =
            `rotate(${currentRotation}deg)`;


        /*
         * Esperamos a que termine
         * la animación.
         */

        setTimeout(() => {

            showSelectedTopic();

        }, 5100);

    }


    /* ==================================================
       MOSTRAR TEMA SELECCIONADO
    ================================================== */

    function showSelectedTopic() {

        const selectedTopic =
            topics[selectedTopicIndex];


        /*
         * Lo mostramos fuera de la rueda.
         *
         * Así nunca tapa los segmentos.
         */

        selectedTopicElement.textContent =
            selectedTopic;


        selectedTopicBox.classList.remove(
            "hidden"
        );


        statusText.textContent =
            "Tema seleccionado";


        /*
         * Ahora empieza el cronómetro.
         */

        startStudyTimer();

    }


    /* ==================================================
       INICIAR 10 MINUTOS
    ================================================== */

    function startStudyTimer() {

        currentPhase = "study";

        currentTime = STUDY_TIME;

        updateTimer();


        statusText.textContent =
            "Estudiando";


        startTimer();

    }


    /* ==================================================
       TEMPORIZADOR
    ================================================== */

    function startTimer() {

        clearInterval(timerInterval);


        timerInterval =
            setInterval(() => {

                currentTime--;

                updateTimer();


                if (currentTime <= 0) {

                    clearInterval(timerInterval);

                    timerFinished();

                }

            }, 1000);

    }


    /* ==================================================
       TERMINÓ EL TIEMPO
    ================================================== */

    function timerFinished() {

        playPleasantSound();


        if (currentPhase === "study") {

            /*
             * Terminó 10 minutos.
             *
             * Preparamos los 2 minutos.
             */

            currentPhase = "break";

            currentTime = BREAK_TIME;


            updateTimer();


            statusText.textContent =
                "¡10 minutos terminados!";


            running = false;


            startButton.disabled = false;

            startButton.style.opacity = "1";

            startButton.textContent =
                "Iniciar";

            startButton.onclick =
                startBreak;


        } else {

            /*
             * Terminó el descanso.
             *
             * Todo queda listo para
             * volver a girar la ruleta.
             */

            running = false;

            currentPhase = "study";

            currentTime = STUDY_TIME;


            updateTimer();


            statusText.textContent =
                "Descanso terminado";


            startButton.disabled = false;

            startButton.style.opacity = "1";

            startButton.textContent =
                "Iniciar";

            startButton.onclick =
                startCycle;


            /*
             * El tema anterior desaparece
             * porque habrá uno nuevo.
             */

            selectedTopicBox.classList.add(
                "hidden"
            );

        }

    }


    /* ==================================================
       INICIAR 2 MINUTOS
    ================================================== */

    function startBreak() {

        if (running) {
            return;
        }


        running = true;

        startButton.disabled = true;

        startButton.style.opacity = "0.5";


        currentPhase = "break";

        currentTime = BREAK_TIME;


        updateTimer();


        statusText.textContent =
            "Descanso";


        startTimer();

    }


    /* ==================================================
       REINICIAR
    ================================================== */

    function resetGame() {

        clearInterval(timerInterval);


        currentPhase = "study";

        currentTime = STUDY_TIME;

        running = false;

        currentRotation = 0;

        selectedTopicIndex = -1;


        wheel.style.transition =
            "none";

        wheel.style.transform =
            "rotate(0deg)";


        selectedTopicBox.classList.add(
            "hidden"
        );


        updateTimer();


        statusText.textContent =
            "Preparado";


        startButton.disabled = false;

        startButton.style.opacity = "1";

        startButton.textContent =
            "Iniciar";

        startButton.onclick =
            startCycle;

    }


    /* ==================================================
       SONIDO AGRADABLE
    ================================================== */

    function playPleasantSound() {

        try {

            const AudioContext =
                window.AudioContext ||
                window.webkitAudioContext;


            const audioContext =
                new AudioContext();


            const now =
                audioContext.currentTime;


            const notes = [
                {
                    frequency: 523.25,
                    time: 0,
                    duration: 0.8
                },
                {
                    frequency: 659.25,
                    time: 0.15,
                    duration: 0.85
                },
                {
                    frequency: 783.99,
                    time: 0.3,
                    duration: 0.9
                }
            ];


            notes.forEach(note => {

                const oscillator =
                    audioContext.createOscillator();

                const gain =
                    audioContext.createGain();


                oscillator.type =
                    "sine";


                oscillator.frequency.setValueAtTime(
                    note.frequency,
                    now + note.time
                );


                gain.gain.setValueAtTime(
                    0,
                    now + note.time
                );


                gain.gain.linearRampToValueAtTime(
                    0.22,
                    now + note.time + 0.05
                );


                gain.gain.exponentialRampToValueAtTime(
                    0.001,
                    now + note.time + note.duration
                );


                oscillator.connect(gain);

                gain.connect(
                    audioContext.destination
                );


                oscillator.start(
                    now + note.time
                );


                oscillator.stop(
                    now +
                    note.time +
                    note.duration
                );

            });

        } catch (error) {

            console.log(
                "No se pudo reproducir el sonido:",
                error
            );

        }

    }

</script>
